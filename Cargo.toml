[workspace]
resolver = "3"
default-members = ["crates/nettest-proto", "crates/nettest-client", "crates/nettest-server"]
members = [
    "crates/nettest-proto",
    "crates/nettest-client",
    "crates/nettest-server",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/gabriel/nettest"

[workspace.dependencies]
nettest-proto = { path = "crates/nettest-proto" }
nettest-server = { path = "crates/nettest-server" }

tokio = { version = "1.53", features = ["rt-multi-thread", "net", "time", "io-util", "sync", "macros", "signal", "fs"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
bytes = "1"
tokio-tungstenite = "0.30"
# TLS: ring provider only. aws-lc-rs (the default) needs cmake + nasm and does not build cleanly
# under mingw cross-compilation, which would break the "zero system dependency" Windows build.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
sha2 = "0.11"
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
dirs = "7"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
hdrhistogram = { version = "7.6", default-features = false }
csv = "1"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
thiserror = "2"
anyhow = "1"
humantime = "2"
# Serverless probes and service management. All of these are already in the dependency tree
# (tokio/mio/rustls pull them in) except windows-service, which is pure Rust over windows-sys.
socket2 = "0.6"
libc = "0.2"
ring = { version = "0.17", default-features = false }
windows-sys = "0.61"
windows-service = "0.8"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
