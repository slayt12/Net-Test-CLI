[package]
name = "nettest-client"
description = "Interactive / headless network troubleshooting client (ws, wss, tcp, udp)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "nettest_client"
path = "src/lib.rs"

[[bin]]
name = "nettest-client"
path = "src/main.rs"

[dependencies]
nettest-proto = { workspace = true }
nettest-service = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures-util = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
anyhow = { workspace = true }
humantime = { workspace = true }

[dev-dependencies]
nettest-server = { workspace = true }

[build-dependencies]
winresource = "0.1"
